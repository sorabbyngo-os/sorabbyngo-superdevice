[package]
name        = "sorabbyngo-superdevice"
version     = "0.1.0"
edition     = "2021"
description = "Sorabbyngo Super Device — distributed hardware pool across all nodes"

[[bin]]
name = "superdevice"
path = "src/main.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
log        = "0.4"
env_logger = "0.11"
